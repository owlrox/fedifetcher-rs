[package]
name = "fedifetcher"
version = "1.0.13"
edition = "2021"
description = "Pull missing posts and profiles into your Mastodon instance (Rust port with web UI)"
license = "MIT"

[lib]
name = "fedifetcher"
path = "src/lib.rs"

[[bin]]
name = "fedifetcher"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
time = { version = "0.3", features = ["serde", "parsing", "formatting", "macros", "local-offset"] }
indexmap = { version = "2", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
regex = "1"
roxmltree = "0.20"
futures = "0.3"
axum = "0.7"
leptos = { version = "0.7", features = ["ssr"] }
leptos_axum = "0.7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
httpmock = "0.7"
