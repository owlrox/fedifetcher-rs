[package]
name = "fedifetcher"
version = "1.1.12"
edition = "2021"
description = "Pull missing posts and profiles into your Mastodon instance (Rust port with web UI)"
license = "GPL-3.0-only"

[lib]
name = "fedifetcher"
path = "src/lib.rs"

[[bin]]
name = "fedifetcher"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
time = { version = "0.3", features = ["serde", "parsing", "formatting", "macros", "local-offset"] }
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
regex = "1"
roxmltree = "0.21"
futures = "0.3"
axum = "0.8"
leptos = { version = "0.8", features = ["ssr"] }
leptos_axum = "0.8"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
httpmock = "0.9"
