[package]
name = "fedifetcher"
version = "1.2.12"
edition = "2024"
rust-version = "1.99.1"
description = "Pull missing posts and profiles into your Mastodon instance (Rust port with web UI)"
license = "GPL-3.0-only"

[lib]
name = "fedifetcher"
path = "src/lib.rs"

# Strictness beyond the defaults: leftover debug macros fail the build,
# and the lossy-cast and time-subtraction lints fire on silent-bug shapes
# (an `as` cast that could truncate, a wall-clock subtraction that could
# underflow). Wider lints stay off, with their cost today: missing_docs
# (~190 undocumented pub fields, variants and methods), the possible_
# truncation/wrap/sign_loss cast group (~28 sites, audited), indexing_
# slicing (25 sites, incl. deliberate byte slicing in robots/http),
# print_stderr (the two eprintln fallbacks in logging.rs, for when the
# database write itself has failed) and unwrap_used/expect_used (locks
# and compiled-in regex patterns, plus unit tests).
[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
cast_lossless = "warn"
unchecked_time_subtraction = "warn"

# The deployed binary panics on arithmetic overflow instead of wrapping
# silently; the runtime cost is a few percent on a background job.
[profile.release]
overflow-checks = true

[[bin]]
name = "fedifetcher"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
time = { version = "0.3", features = ["serde", "parsing", "formatting", "macros", "local-offset"] }
indexmap = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
regex = "1"
roxmltree = "0.21"
futures = "0.3"
axum = "0.8"
leptos = { version = "0.8", features = ["ssr"] }
leptos_axum = "0.8"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
httpmock = "0.9"
